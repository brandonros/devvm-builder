name: ci

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Ubuntu 24.04 blocks unprivileged user namespaces via AppArmor by default,
      # which breaks systemd-repart inside the nix sandbox.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build qcow2 image
        run: |
          nix build .#devvm --print-build-logs

          mkdir -p artifacts

          # `result` is the qcow2 file itself (output of qemu-img convert).
          cp -L result artifacts/devvm.qcow2

          # `cp` from /nix/store inherits mode 444; make it writable so consumers
          # don't have to chmod after download (qemu needs write access to boot).
          chmod 644 artifacts/devvm.qcow2

          ls -lh artifacts/

      - name: Grow qcow2 virtual disk
        run: |
          qemu-img resize artifacts/devvm.qcow2 +100G
          qemu-img info artifacts/devvm.qcow2

      - name: Compress artifact
        run: |
          cd artifacts
          for f in *.qcow2; do
            [ -e "$f" ] || continue
            zstd -T0 -10 "$f" -o "$f.zst"
            rm "$f"
          done
          ls -lh

      - name: Upload qcow2
        uses: actions/upload-artifact@v4
        with:
          name: devvm-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0  # already zstd-compressed; skip upload-artifact's zip pass
